<script>
// Expand Telegram Mini App Window
if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
}

// 2-Step Conflict-Free Monetag + Adsterra Smartlink Handler
function handleUnlock(smartlinkUrl, buttonId) {
    const unlockBtn = document.getElementById(buttonId);
    
    // Step 1: Loading state
    unlockBtn.innerText = "⏳ Loading Ad/Task...";
    unlockBtn.disabled = true;

    // Trigger Monetag Rewarded Ad
    if (typeof show_11874048 === 'function') {
        show_11874048().then(() => {
            // Task Successfully Completed!
            unlockBtn.innerText = "✅ Task Done! Click to Access";
            unlockBtn.style.background = "#28a745"; // Green button
            unlockBtn.disabled = false;
            
            // Set 2nd Click -> Redirects to Adsterra Smartlink
            unlockBtn.onclick = function() {
                window.location.href = smartlinkUrl;
            };

        }).catch(e => {
            console.error("Ad Error / Blocked:", e);
            // If Monetag fails or is blocked, allow user to continue
            unlockBtn.innerText = "▶️ Continue to Video";
            unlockBtn.style.background = "#28a745";
            unlockBtn.disabled = false;
            
            unlockBtn.onclick = function() {
                window.location.href = smartlinkUrl;
            };
        });
    } else {
        // Fallback if SDK is not loaded
        window.location.href = smartlinkUrl;
    }
}
</script>
